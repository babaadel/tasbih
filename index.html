<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d2829">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تسبيح</title>
<style>
  :root{ --bg:#0d2829; --card:#143a3b; --line:#1f4f50; --gold:#e8c874; --cream:#f6efd9; --muted:#8fb2ae; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);
    font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic","Segoe UI",Tahoma,serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;}
  .app{max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);position:relative;}

  header{display:flex;justify-content:space-between;align-items:center;}
  h1{margin:0;font-size:1.5rem;color:var(--gold);font-weight:700;}
  .today{color:var(--muted);font-size:.95rem;}
  .today b{color:var(--cream);font-size:1.1rem;margin-inline-start:4px;}

  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;padding:4px;gap:4px;}
  .tabs button{border:none;background:none;color:var(--muted);font:inherit;font-size:1rem;padding:10px;border-radius:11px;cursor:pointer;}
  .tabs button.on{background:var(--gold);color:#2a2008;font-weight:700;}

  .dhikr{background:var(--card);border-radius:18px;padding:14px 16px;text-align:center;
    min-height:84px;display:flex;align-items:center;justify-content:center;
    font-size:2rem;line-height:1.5;color:var(--cream);}
  .dhikr.long{font-size:1.25rem;line-height:1.8;}
  .dots{display:flex;justify-content:center;gap:8px;min-height:10px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dots i.done{background:var(--gold);opacity:.55;}
  .dots i.cur{background:var(--gold);}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  .tap{position:relative;width:min(76vw,44dvh);aspect-ratio:1;border:none;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 50% 35%,#1b4a4b,#123334);color:var(--cream);font:inherit;
    box-shadow:0 14px 40px rgba(0,0,0,.35), inset 0 0 0 2px rgba(255,255,255,.04);padding:0;
    transition:transform .08s;}
  .tap.pulse{transform:scale(.965);}
  .tap svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .tap circle{fill:none;stroke-width:9;stroke-linecap:round;}
  .tap .bg{stroke:var(--line);}
  .tap .fg{stroke:var(--gold);transition:stroke-dashoffset .18s ease-out;}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;direction:ltr;}
  .num{font-size:clamp(3.4rem,18vw,5.4rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .sub{color:var(--muted);font-size:1rem;direction:rtl;}

  .ctl{display:flex;flex-direction:column;gap:8px;}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--cream);font:inherit;
    font-size:.95rem;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;}
  .chips button.on{background:var(--gold);color:#2a2008;border-color:var(--gold);font-weight:700;}
  .label{color:var(--muted);font-size:.85rem;}

  footer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  footer button{border:none;background:var(--card);color:var(--cream);font:inherit;font-size:1rem;
    padding:12px 6px;border-radius:14px;cursor:pointer;}
  footer button:active{background:var(--line);}
  footer button.warn{background:#5a2d2d;}

  #done{position:absolute;inset:0;background:rgba(8,26,27,.96);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;z-index:5;}
  #done.show{display:flex;}
  #done h2{margin:0;font-size:2.2rem;color:var(--gold);}
  #done p{margin:0;font-size:1.2rem;color:var(--muted);line-height:1.8;}
  #done button{margin-top:10px;border:none;background:var(--gold);color:#2a2008;font:inherit;font-size:1.1rem;
    font-weight:700;padding:14px 32px;border-radius:14px;cursor:pointer;}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){.tap,.tap .fg{transition:none;}}
  .hidden{display:none !important;}

  .bell{border:none;background:var(--card);color:var(--muted);font:inherit;font-size:.9rem;padding:8px 12px;
    border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .bell.on{background:var(--gold);color:#2a2008;font-weight:700;}
  .bell svg{width:18px;height:18px;fill:currentColor;}

  #toast{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:16px;right:16px;background:var(--gold);
    color:#2a2008;border-radius:16px;padding:14px 16px;text-align:center;font-size:1.5rem;font-weight:700;
    z-index:8;transform:translateY(-160%);transition:transform .3s;pointer-events:none;}
  #toast.show{transform:none;}

  #sheet{position:fixed;inset:0;background:rgba(5,18,19,.65);display:none;align-items:flex-end;justify-content:center;z-index:9;}
  #sheet.open{display:flex;}
  .sheet-in{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;gap:10px;}
  .sheet-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.15rem;color:var(--gold);}
  .sheet-top button{background:none;border:none;color:var(--muted);font:inherit;font-size:1rem;cursor:pointer;padding:6px 8px;}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:1.05rem;}
  .switch{width:54px;height:30px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;padding:0;}
  .switch::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;
    background:var(--cream);transition:transform .2s;}
  .switch[aria-checked="true"]{background:var(--gold);}
  .switch[aria-checked="true"]::after{transform:translateX(-24px);background:#2a2008;}
  .test{border:1px solid var(--line);background:none;color:var(--cream);font:inherit;font-size:1rem;padding:11px;border-radius:12px;cursor:pointer;}
  .note{margin:0;color:var(--muted);font-size:.85rem;line-height:1.7;}
  #next{color:var(--gold);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>تسبيح</h1>
    <button type="button" class="bell" id="bell">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 1 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
      تنبيه
    </button>
    <div class="today">اليوم<b id="today">0</b></div>
  </header>

  <nav class="tabs">
    <button type="button" data-mode="seq">بعد الصلاة</button>
    <button type="button" data-mode="free">تسبيح حر</button>
  </nav>

  <section class="dhikr" id="dhikr"></section>
  <div class="dots" id="dots"></div>

  <div class="stage">
    <button type="button" class="tap" id="tap" aria-label="سبّح">
      <svg viewBox="0 0 240 240" aria-hidden="true">
        <circle class="bg" cx="120" cy="120" r="108"/>
        <circle class="fg" id="ring" cx="120" cy="120" r="108" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
      </svg>
      <div class="face"><div class="num" id="num">0</div><div class="sub" id="sub"></div></div>
    </button>
  </div>

  <section class="ctl" id="freeCtl">
    <div class="label">الذكر</div>
    <div class="chips" id="dhikrChips"></div>
    <div class="label">الهدف</div>
    <div class="chips" id="targetChips"></div>
  </section>

  <footer>
    <button type="button" id="undo">تراجع</button>
    <button type="button" id="reset">تصفير</button>
    <button type="button" id="vib">الاهتزاز: تشغيل</button>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="done">
    <h2>تقبّل الله طاعتكم</h2>
    <p>أتممتم التسبيح بعد الصلاة<br>سبحان الله والحمد لله والله أكبر</p>
    <button type="button" id="again">ابدأ من جديد</button>
  </div>
</div>

<div id="sheet">
  <div class="sheet-in">
    <div class="sheet-top"><span>التنبيه الصوتي بالأذكار</span><button type="button" id="sClose">إغلاق</button></div>
    <div class="row"><span>تفعيل التنبيه</span><button type="button" class="switch" id="remToggle" role="switch" aria-checked="false" aria-label="تفعيل التنبيه"></button></div>
    <div class="label">كل كم دقيقة</div>
    <div class="chips" id="minChips"></div>
    <div class="label">طريقة التنبيه</div>
    <div class="chips" id="modeChips"></div>
    <div class="label" id="next"></div>
    <div class="label" id="voiceNote"></div>
    <button type="button" class="test" id="testRem">تجربة الصوت</button>
    <p class="note">لكي يعمل التنبيه أبقِ هذه الصفحة مفتوحة وشاشة الجوال مضاءة. المتصفح يوقف الصوت والمؤقتات عند قفل الشاشة أو إغلاق الصفحة.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const SEQ = [
  {t:'سبحان الله', n:33},
  {t:'الحمد لله', n:33},
  {t:'الله أكبر', n:33},
  {t:'لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير', n:1}
];
const FREE = ['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','أستغفر الله',
  'لا حول ولا قوة إلا بالله','سبحان الله وبحمده','اللهم صلّ على محمد'];
const TARGETS = [33, 99, 100, 0];

const dayKey = () => new Date().toLocaleDateString('en-CA');
const st = { mode:'seq', seqIdx:0, seqCount:0, done:false, freeIdx:0, counts:{}, target:33, vib:true,
             today:{d:dayKey(), n:0}, rem:{on:false,min:5,speak:true,i:0} };

function save(){ try{ localStorage.setItem('tasbih-state', JSON.stringify(st)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem('tasbih-state')||'null');
    if(s && typeof s==='object') Object.assign(st, s);
  }catch(e){}
  if(!st.today || st.today.d!==dayKey()) st.today = {d:dayKey(), n:0};
  if(!st.counts) st.counts = {};
  st.rem = Object.assign({on:false,min:5,speak:true,i:0}, st.rem || {});
}

function buzz(p){ if(st.vib && navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }
let wake=null;
async function keepAwake(){ if(wake) return; try{ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>wake=null); }catch(e){} }

function bumpToday(d){
  if(st.today.d!==dayKey()) st.today={d:dayKey(),n:0};
  st.today.n = Math.max(0, st.today.n + d);
}

function tap(){
  keepAwake();
  if(st.mode==='seq'){
    if(st.done) return;
    const cur = SEQ[st.seqIdx];
    st.seqCount++; bumpToday(1);
    if(st.seqCount >= cur.n){
      if(st.seqIdx === SEQ.length-1){ st.done = true; buzz([200,80,200,80,350]); }
      else { st.seqIdx++; st.seqCount = 0; buzz([70,40,70]); }
    } else buzz(12);
  } else {
    const i = st.freeIdx;
    st.counts[i] = (st.counts[i]||0) + 1; bumpToday(1);
    if(st.target>0 && st.counts[i] % st.target === 0) buzz([120,60,120]); else buzz(12);
  }
  pulse(); save(); render();
}

function undo(){
  if(st.mode==='seq'){
    if(st.done){ st.done=false; st.seqCount = SEQ[st.seqIdx].n - 1; bumpToday(-1); }
    else if(st.seqCount>0){ st.seqCount--; bumpToday(-1); }
    else if(st.seqIdx>0){ st.seqIdx--; st.seqCount = SEQ[st.seqIdx].n - 1; bumpToday(-1); }
  } else if((st.counts[st.freeIdx]||0) > 0){ st.counts[st.freeIdx]--; bumpToday(-1); }
  save(); render();
}

let resetArmed=null;
function reset(){
  const b=$('reset');
  if(!resetArmed){
    b.textContent='تأكيد التصفير؟'; b.classList.add('warn');
    resetArmed=setTimeout(disarm,2500); return;
  }
  disarm();
  if(st.mode==='seq'){ st.seqIdx=0; st.seqCount=0; st.done=false; } else st.counts[st.freeIdx]=0;
  save(); render();
}
function disarm(){ clearTimeout(resetArmed); resetArmed=null; const b=$('reset'); b.textContent='تصفير'; b.classList.remove('warn'); }

function pulse(){ const t=$('tap'); t.classList.add('pulse'); setTimeout(()=>t.classList.remove('pulse'),70); }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.mode===st.mode));
  $('freeCtl').classList.toggle('hidden', st.mode!=='free');
  $('today').textContent = st.today.n;
  $('vib').textContent = 'الاهتزاز: ' + (st.vib?'تشغيل':'إيقاف');

  let text, count, target, sub, frac;
  if(st.mode==='seq'){
    const cur=SEQ[st.seqIdx];
    text=cur.t; count=st.seqCount; target=cur.n;
    sub = cur.n>1 ? 'من '+cur.n : 'ختام المئة';
    frac = st.done ? 1 : count/target;
    $('dots').innerHTML = SEQ.map((_,i)=>`<i class="${i<st.seqIdx||st.done?'done':i===st.seqIdx?'cur':''}"></i>`).join('');
  } else {
    text=FREE[st.freeIdx]; count=st.counts[st.freeIdx]||0; target=st.target;
    if(target>0){
      const cycles=Math.floor((count-1)/target);
      sub = 'من '+target + (count>target ? ' · دورة '+(cycles+1) : '');
      frac = count===0 ? 0 : ((count-1)%target+1)/target;
    } else { sub='بلا حد'; frac=0; }
    $('dots').innerHTML='';
  }
  const d=$('dhikr'); d.textContent=text; d.classList.toggle('long', text.length>30);
  $('num').textContent = count;
  $('sub').textContent = sub;
  $('ring').style.strokeDashoffset = 100*(1-frac);
  $('done').classList.toggle('show', st.mode==='seq' && st.done);
}

function buildChips(){
  const dc=$('dhikrChips'); dc.innerHTML='';
  FREE.forEach((t,i)=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=t;
    b.classList.toggle('on', i===st.freeIdx);
    b.onclick=()=>{ st.freeIdx=i; save(); buildChips(); render(); };
    dc.appendChild(b);
  });
  const tc=$('targetChips'); tc.innerHTML='';
  TARGETS.forEach(n=>{
    const b=document.createElement('button'); b.type='button'; b.textContent = n===0 ? 'بلا حد' : n;
    b.classList.toggle('on', n===st.target);
    b.onclick=()=>{ st.target=n; save(); buildChips(); render(); };
    tc.appendChild(b);
  });
}

/* ---------- events ---------- */
$('tap').addEventListener('pointerdown', e=>{ e.preventDefault(); tap(); });
$('tap').addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); tap(); } });
$('undo').onclick = undo;
$('reset').onclick = reset;
$('vib').onclick = ()=>{ st.vib=!st.vib; save(); render(); };
$('again').onclick = ()=>{ st.seqIdx=0; st.seqCount=0; st.done=false; save(); render(); };
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ disarm(); st.mode=b.dataset.mode; save(); render(); });
/* ---------- audio reminders ---------- */
const MINS = [1, 3, 5, 10, 15];
let actx=null, nextAt=0, tickTimer=null, arVoice=null, toastT=null;

function ensureAudio(){
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function chime(){
  if(!actx) return;
  const t0 = actx.currentTime;
  [[659.25,0],[880,0.28],[1318.5,0.56]].forEach(([f,d])=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t0+d);
    g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+d+1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(t0+d); o.stop(t0+d+1.2);
  });
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  arVoice = speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)) || null;
  renderRem();
}
function speak(text){
  if(!st.rem.speak || !arVoice || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = arVoice; u.lang = arVoice.lang; u.rate = .85;
    speechSynthesis.speak(u);
  }catch(e){}
}
function showToast(text){
  const t=$('toast'); t.textContent=text; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),7000);
}
function currentReminderText(){ return FREE[(st.rem.i||0) % FREE.length]; }
function fireReminder(){
  const text = currentReminderText();
  st.rem.i = ((st.rem.i||0)+1) % FREE.length; save();
  ensureAudio(); chime(); buzz([100,50,100]); showToast(text);
  setTimeout(()=>speak(text), 1600);
}
function updateNext(){
  const el=$('next');
  if(!st.rem.on){ el.textContent=''; return; }
  const s=Math.max(0,Math.round((nextAt-Date.now())/1000));
  el.textContent='التنبيه التالي بعد '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function tick(){
  if(!st.rem.on) return;
  if(Date.now() >= nextAt){ fireReminder(); nextAt = Date.now() + st.rem.min*60000; }
  updateNext();
}
function startRem(){
  nextAt = Date.now() + st.rem.min*60000;
  clearInterval(tickTimer); tickTimer = setInterval(tick,1000);
  keepAwake();
}
function stopRem(){
  clearInterval(tickTimer); tickTimer=null;
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
}

function renderRem(){
  $('bell').classList.toggle('on', st.rem.on);
  const sw=$('remToggle'); sw.setAttribute('aria-checked', String(st.rem.on));
  $('voiceNote').textContent = (st.rem.speak && !arVoice)
    ? 'لا يوجد صوت عربي في جهازك، فسيصدر التنبيه نغمةً فقط. يمكنك تثبيت صوت عربي من إعدادات تحويل النص إلى كلام في الجوال.'
    : '';
  updateNext();
}
function buildRem(){
  const mc=$('minChips'); mc.innerHTML='';
  MINS.forEach(m=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=m+' د';
    b.classList.toggle('on', m===st.rem.min);
    b.onclick=()=>{ st.rem.min=m; save(); if(st.rem.on) nextAt=Date.now()+m*60000; buildRem(); renderRem(); };
    mc.appendChild(b);
  });
  const oc=$('modeChips'); oc.innerHTML='';
  [[false,'نغمة فقط'],[true,'نغمة + نطق الذكر']].forEach(([v,label])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=label;
    b.classList.toggle('on', st.rem.speak===v);
    b.onclick=()=>{ st.rem.speak=v; save(); buildRem(); renderRem(); };
    oc.appendChild(b);
  });
}

$('bell').onclick = ()=>{ $('sheet').classList.add('open'); renderRem(); };
$('sClose').onclick = ()=>$('sheet').classList.remove('open');
$('sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') $('sheet').classList.remove('open'); });
$('remToggle').onclick = ()=>{
  ensureAudio();
  st.rem.on = !st.rem.on; save();
  if(st.rem.on) startRem(); else stopRem();
  renderRem();
};
$('testRem').onclick = ()=>{
  ensureAudio(); chime();
  const text=currentReminderText(); showToast(text);
  setTimeout(()=>speak(text),1600);
};
document.addEventListener('pointerdown', ()=>{ if(st.rem.on) ensureAudio(); }, {passive:true});
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && st.rem.on){ keepAwake(); tick(); }
});
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

load(); buildChips(); render(); buildRem(); renderRem(); if(st.rem.on) startRem();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
